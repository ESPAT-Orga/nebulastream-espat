query: |
  SELECT STATISTICSTART, STATISTICEND, rowIndex, columnIndex, counter FROM (
    SELECT COUNTMIN_PROBE(300, uint64)
    FROM probe_source
  ) INTO void_sink;
sinks:
  - name: void_sink
    host: localhost:8080
    schema:
      - name: probe_source$STATISTICSTART
        type: UINT64
        nullable: false
      - name: probe_source$STATISTICEND
        type: UINT64
        nullable: false
      - name: probe_source$rowIndex
        type: UINT64
        nullable: false
      - name: probe_source$columnIndex
        type: UINT64
        nullable: false
      - name: probe_source$counter
        type: UINT64
        nullable: false
    type: Void
    config: { }
    parser_config: { }
logical:
  - name: probe_source
    schema:
      - name: STATISTICID
        type: UINT64
        nullable: false
      - name: STATISTICSTART
        type: UINT64
        nullable: false
      - name: STATISTICEND
        type: UINT64
        nullable: false
      - name: STATISTICNUMBEROFSEENTUPLES
        type: UINT64
        nullable: false
physical:
  - logical: probe_source
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
    source_config:
      file_path: /home/ntantow/Documents/Data/espat-1/probe_results/reproduction/probe_1781000427_ClusterMonitoring_CountMin_mb10240_ws10sec_16t_DEFAULT_1ids_100xwindow_1tuples_1000reps_run2/probe_tuples_CountMinBuild_10240.csv
workers:
  - host: localhost:8080
    data_address: localhost:9090
