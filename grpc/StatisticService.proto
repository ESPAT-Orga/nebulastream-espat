syntax = "proto3";
package NES;

import "google/protobuf/empty.proto";

/// Message sent from a probe sink to the StatisticManager after each window closes.
message StatisticReport {
    int64  statistic_id = 1;
    uint64 start_ts     = 2;
    uint64 end_ts       = 3;
    double value        = 4;
}

/// Message sent from the StatisticManager to a statistic gRPC source to trigger a probe.
message StatisticRequest {
    int64  statistic_id = 1;
    uint64 start_ts     = 2;
    uint64 end_ts       = 3;
}

/// gRPC service hosted by the StatisticManager; probe sinks call ReportStatistic.
service StatisticManagerService {
    rpc ReportStatistic(StatisticReport) returns (google.protobuf.Empty);
}

/// gRPC service hosted by the statistic gRPC source; the StatisticManager calls RequestStatistic
/// to trigger an on-demand probe for a given time range.
service StatisticSourceService {
    rpc RequestStatistic(StatisticRequest) returns (google.protobuf.Empty);
}
