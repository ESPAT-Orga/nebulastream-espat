query: SELECT EQUIWIDTHHISTOGRAM(200, userId, 10240, 0, 100000) FROM build_source WINDOW TUMBLING(creationTS, size 5 sec) INTO void_sink;
sinks:
  - name: void_sink
    host: localhost:8080
    schema:
      - name: build_source$statisticid
        type: UINT64
        nullable: false
      - name: build_source$statisticstart
        type: UINT64
        nullable: false
      - name: build_source$statisticend
        type: UINT64
        nullable: false
      - name: build_source$statisticnumberofseentuples
        type: UINT64
        nullable: false
    type: Void
    config: { }
    parser_config: { }
logical:
  - name: build_source
    schema:
      - name: creationTS
        type: UINT64
        nullable: false
      - name: jobId
        type: UINT64
        nullable: false
      - name: taskId
        type: UINT64
        nullable: false
      - name: machineId
        type: INT64
        nullable: false
      - name: eventType
        type: INT16
        nullable: false
      - name: userId
        type: INT16
        nullable: false
      - name: category
        type: INT16
        nullable: false
      - name: priority
        type: INT16
        nullable: false
      - name: cpu
        type: FLOAT64
        nullable: false
      - name: ram
        type: FLOAT64
        nullable: false
      - name: disk
        type: FLOAT64
        nullable: false
      - name: constraints
        type: BOOLEAN
        nullable: false
physical:
  - logical: build_source
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
    source_config:
      file_path: /home/ntantow/Documents/Data/espat-1/cmake-build-release/nes-systests/testdata/large/cluster_monitoring/google-cluster-data-original_1G.csv
workers:
  - host: localhost:8080
    data_address: localhost:9090
