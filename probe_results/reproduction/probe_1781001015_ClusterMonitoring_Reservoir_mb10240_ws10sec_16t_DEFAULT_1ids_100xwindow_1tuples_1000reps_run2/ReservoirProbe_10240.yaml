query: |
  SELECT STATISTICSTART, STATISTICEND, jobId, taskId, machineId, eventType, userId, category, priority, cpu, ram, disk, constraints FROM (
    SELECT RESERVOIR_PROBE(100, jobId, uint64, taskId, uint64, machineId, int64, eventType, int16, userId, int16, category, int16, priority, int16, cpu, float64, ram, float64, disk, float64, constraints, boolean)
    FROM probe_source
  ) INTO void_sink;
sinks:
  - name: void_sink
    host: localhost:8080
    schema:
      - name: probe_source$STATISTICSTART
        type: UINT64
        nullable: false
      - name: probe_source$STATISTICEND
        type: UINT64
        nullable: false
      - name: probe_source$jobId
        type: UINT64
        nullable: false
      - name: probe_source$taskId
        type: UINT64
        nullable: false
      - name: probe_source$machineId
        type: INT64
        nullable: false
      - name: probe_source$eventType
        type: INT16
        nullable: false
      - name: probe_source$userId
        type: INT16
        nullable: false
      - name: probe_source$category
        type: INT16
        nullable: false
      - name: probe_source$priority
        type: INT16
        nullable: false
      - name: probe_source$cpu
        type: FLOAT64
        nullable: false
      - name: probe_source$ram
        type: FLOAT64
        nullable: false
      - name: probe_source$disk
        type: FLOAT64
        nullable: false
      - name: probe_source$constraints
        type: BOOLEAN
        nullable: false
    type: Void
    config: { }
    parser_config: { }
logical:
  - name: probe_source
    schema:
      - name: STATISTICID
        type: UINT64
        nullable: false
      - name: STATISTICSTART
        type: UINT64
        nullable: false
      - name: STATISTICEND
        type: UINT64
        nullable: false
      - name: STATISTICNUMBEROFSEENTUPLES
        type: UINT64
        nullable: false
physical:
  - logical: probe_source
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
    source_config:
      file_path: /tmp/espat-1/probe_results/reproduction/probe_1781001015_ClusterMonitoring_Reservoir_mb10240_ws10sec_16t_DEFAULT_1ids_100xwindow_1tuples_1000reps_run2/probe_tuples_ReservoirBuild_10240.csv
workers:
  - host: localhost:8080
    data_address: localhost:9090
